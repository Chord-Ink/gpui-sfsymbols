[package]
name = "sfsymbols"
version = "0.2.1"
description = "Type-safe SF Symbols enums for Rust"
documentation = "https://docs.rs/sfsymbols"
keywords = ["sf-symbols", "macos", "icons", "apple"]
categories = ["gui", "os::macos-apis"]
exclude = ["target/"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["v7"]
# Major versions (merged)
v1 = []
v2 = []
v3 = []
v4 = []
v5 = []
v6 = []
v7 = []
# Minor versions (precise)
v1-0 = []
v1-1 = []
v2-0 = []
v2-1 = []
v2-2 = []
v3-0 = []
v3-1 = []
v3-2 = []
v3-3 = []
v4-0 = []
v4-1 = []
v4-2 = []
v5-0 = []
v5-1 = []
v5-2 = []
v5-3 = []
v5-4 = []
v6-0 = []
v6-1 = []
v6-2 = []
v6-3 = []
v6-4 = []
v7-0 = []
v7-1 = []
# All versions
all = ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v1-0", "v1-1", "v2-0", "v2-1", "v2-2", "v3-0", "v3-1", "v3-2", "v3-3", "v4-0", "v4-1", "v4-2", "v5-0", "v5-1", "v5-2", "v5-3", "v5-4", "v6-0", "v6-1", "v6-2", "v6-3", "v6-4", "v7-0", "v7-1"]
# Unified enum (all symbols deduplicated)
unified = []
