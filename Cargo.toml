[workspace]
resolver = "3"
members = [
    "crates/gpui-sfsymbols",
    "crates/sfsymbols",
    "crates/sfsymbols-codegen",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["AprilNEA <dev@aprilnea.com> (https://aprilnea.me)"]
repository = "https://github.com/Chord-Ink/gpui-sfsymbols"

[workspace.dependencies]
gpui = { git = "https://github.com/Chord-Ink/gpui" }
gpui_platform = { git = "https://github.com/Chord-Ink/gpui", features = ["font-kit"] }
smallvec = "1.15.2"
image = { version = "0.25.10", default-features = false }
log = "0.4"
sfsymbols = { version = "0.2.1", path = "crates/sfsymbols", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSString",
    "NSGeometry",
    "NSArray",
    "NSAffineTransform",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "objc2-core-foundation",
    "NSImage",
    "NSColor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSFontDescriptor",
    "NSAffineTransform",
] }
